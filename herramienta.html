<script>
/*
  Compatibilidad:
  - herramienta.html?id=porcentaje
  - herramienta.html?tool=porcentaje

  Tu index actual usa ?tool=..., mientras que tools.js usa ?id=...
  Este pequeño bloque convierte automáticamente "tool" en "id".
*/
(function () {
  const params = new URLSearchParams(window.location.search);
  const tool = params.get("tool");
  const id = params.get("id");

  if (tool && !id) {
    params.delete("tool");
    params.set("id", tool);
    const newUrl = window.location.pathname + "?" + params.toString();
    window.history.replaceState({}, "", newUrl);
  }
})();
</script>
